<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Welcome to GitHub Pages with ChatGPT Codex</title>
  </head>
  <body>
    <h1>Welcome!</h1>
    <p>This page is powered by <strong>GitHub Pages</strong> and built with help from <strong>ChatGPT Codex</strong>.</p>

    <h2>Overview</h2>
    <p>GitHub Pages hosts static websites straight from a repository, while ChatGPT Codex helps generate and modify content using AI.</p>

    <h2>Fun with dynamic content</h2>
    <p>The current time is: <span id="current-time"></span></p>
    <button id="color-button">Change background color</button>

    <script>
      function updateTime() {
        const now = new Date();
        document.getElementById('current-time').textContent = now.toLocaleString();
      }
      updateTime();
      setInterval(updateTime, 1000);

      document.getElementById('color-button').addEventListener('click', () => {
        const colors = ['#fde68a', '#a7f3d0', '#bfdbfe', '#fca5a5', '#d8b4fe'];
        document.body.style.backgroundColor =
          colors[Math.floor(Math.random() * colors.length)];
      });
    </script>
  </body>
</html>
